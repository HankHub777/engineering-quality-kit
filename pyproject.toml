[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-quality-kit"
version = "0.1.0"
description = "Low-friction, evidence-first quality adoption for new and existing repositories."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
eqk = "eqk.cli:main"

[tool.setuptools]
packages = ["eqk"]

[tool.setuptools.package-data]
eqk = ["profiles/*.json", "templates/*"]

[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
exclude = ["^examples/", "^build/"]

[[tool.mypy.overrides]]
module = ["jsonschema"]
ignore_missing_imports = true
